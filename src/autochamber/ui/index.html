<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoCode settings</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#autocode-main">Skip to main content</a>
    <header class="page-header">
      <div class="page-shell stack">
        <div>
          <h1>AutoCode settings</h1>
          <p class="muted">Manage settings and masked profiles in AutoChamber.</p>
        </div>
        <nav aria-label="Settings navigation">
          <a href="#settings">Settings</a>
          <a href="#profiles">Profiles</a>
        </nav>
      </div>
    </header>
    <main id="autocode-main" class="page-shell stack" tabindex="-1">
      <section id="settings" class="panel stack" aria-labelledby="settings-heading">
        <h2 id="settings-heading">Settings</h2>
        <div id="settings-root" role="group" aria-labelledby="settings-heading">
          <p class="notice">Bridge not connected. No saved settings are exposed.</p>
        </div>
      </section>
      <section id="profiles" class="panel stack" aria-labelledby="profiles-heading">
        <h2 id="profiles-heading">Profiles</h2>
        <div id="profiles-root" role="group" aria-labelledby="profiles-heading">
          <p class="notice">Bridge not connected. No saved profiles are exposed.</p>
        </div>
      </section>
    </main>
  </body>
</html>
